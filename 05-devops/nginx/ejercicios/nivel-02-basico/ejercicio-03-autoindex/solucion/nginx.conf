events { worker_connections 1024; }
http {
    server {
        listen 8080;
        root /ruta/abs/a/web;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /descargas/ {
            alias /ruta/abs/a/web/descargas/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }
    }
}
