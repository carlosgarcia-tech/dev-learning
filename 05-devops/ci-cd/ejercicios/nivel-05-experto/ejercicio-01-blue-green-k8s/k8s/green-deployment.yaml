apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-app-green
  labels:
    app: mi-app
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mi-app
      version: green
  template:
    metadata:
      labels:
        app: mi-app
        version: green
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
