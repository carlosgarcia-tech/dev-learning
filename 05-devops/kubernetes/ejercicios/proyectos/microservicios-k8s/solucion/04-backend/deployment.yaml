# 04-backend/deployment.yaml — Deployment del backend (Flask) con sondas y recursos
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tienda-online
  labels:
    app: tienda
    component: backend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tienda
      component: backend
  template:
    metadata:
      labels:
        app: tienda
        component: backend
        version: v1
    spec:
      serviceAccountName: tienda-sa
      containers:
        - name: backend
          image: tienda/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: tienda-config
            - secretRef:
                name: tienda-secrets
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
