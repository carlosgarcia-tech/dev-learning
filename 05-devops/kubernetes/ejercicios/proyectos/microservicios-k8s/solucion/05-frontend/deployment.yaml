# 05-frontend/deployment.yaml — Deployment del frontend (nginx) con sondas y recursos
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tienda-online
  labels:
    app: tienda
    component: frontend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tienda
      component: frontend
  template:
    metadata:
      labels:
        app: tienda
        component: frontend
        version: v1
    spec:
      serviceAccountName: tienda-sa
      containers:
        - name: frontend
          image: tienda/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
