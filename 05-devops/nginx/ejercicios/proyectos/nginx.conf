# nginx.conf — Proyecto final: Reverse proxy de producción para microservicios
# TODO: completa este archivo siguiendo las fases del README.md

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # TODO: incluir configs modularizadas
    include conf.d/*.conf;

    # TODO: incluir variables de entorno (cambiar dev por staging/prod)
    # include envs/dev.conf;
}
