apiVersion: v1
kind: Pod
metadata:
  name: app-pv
  labels:
    app: app-pv
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      volumeMounts:
        - name: datos
          mountPath: /usr/share/nginx/html
  volumes:
    - name: datos
      persistentVolumeClaim:
        claimName: pvc-datos
