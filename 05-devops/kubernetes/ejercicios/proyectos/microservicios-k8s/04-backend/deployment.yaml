# 04-backend/deployment.yaml — Deployment del backend (Flask) — INCOMPLETO
# TODO: completa el Deployment del backend con sondas, env y resources.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tienda-online
  labels:
    app: tienda
    component: backend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tienda
      component: backend
  template:
    metadata:
      labels:
        app: tienda
        component: backend
        version: v1
    spec:
      serviceAccountName: tienda-sa
      containers:
        - name: backend
          image: tienda/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          # TODO: carga config y secretos con envFrom
          #   - configMapRef: tienda-config
          #   - secretRef: tienda-secrets
          envFrom:
            - configMapRef:
                name: tienda-config
            - secretRef:
                name: tienda-secrets
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
          # TODO: define resources.requests y limits (cpu/memoria)
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # TODO: añade livenessProbe (httpGet /health) y readinessProbe (httpGet /ready)
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
