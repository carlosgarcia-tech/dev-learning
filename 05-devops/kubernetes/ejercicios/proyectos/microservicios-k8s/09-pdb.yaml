# 09-pdb.yaml — PodDisruptionBudget para backend y frontend
# TODO: define los PodDisruptionBudget para garantizar resiliencia.

# 1) PDB del backend: al menos 1 pod disponible
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: tienda-online
  labels:
    app: tienda
    component: backend
spec:
  # TODO: define minAvailable: 1 y el selector del backend
  minAvailable: 1
  selector:
    matchLabels:
      app: tienda
      component: backend
---
# 2) PDB del frontend: al menos 2 pods disponibles
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: tienda-online
  labels:
    app: tienda
    component: frontend
spec:
  # TODO: define minAvailable: 2 y el selector del frontend
  minAvailable: 2
  selector:
    matchLabels:
      app: tienda
      component: frontend
