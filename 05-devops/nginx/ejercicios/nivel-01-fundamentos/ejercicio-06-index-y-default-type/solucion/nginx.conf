events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server {
        listen 8080;
        root /ruta/abs/a/web;
        index index.html;
        location / {
            try_files $uri $uri/ =404;
        }
        location /api/ {
            default_type application/json;
            try_files $uri =404;
        }
    }
}
