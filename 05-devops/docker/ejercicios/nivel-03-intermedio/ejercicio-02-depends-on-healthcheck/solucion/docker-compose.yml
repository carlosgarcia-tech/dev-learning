services:
  app:
    build: ./app
    ports:
      - "8092:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [appnet]

  reporter:
    image: alpine:3.20
    depends_on:
      app:
        condition: service_healthy
    command: ["sh", "-c", "wget -qO- http://app:3000/health && echo OK"]
    networks: [appnet]

networks:
  appnet:
