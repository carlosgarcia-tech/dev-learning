events { worker_connections 1024; }
http {
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /ruta/abs/a/web;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }
}
