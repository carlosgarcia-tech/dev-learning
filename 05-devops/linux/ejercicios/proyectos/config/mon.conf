# Configuración del sistema de monitorización y backups
# Editar según necesidades del servidor.

# Umbrales de alerta (porcentaje o valor numérico)
ALERT_CPU=80        # % de load average relativo a núcleos
ALERT_MEM=90        # % de memoria usada
ALERT_DISK=90       # % de disco usado en /

# Rutas
LOG_DIR=/var/log/monitoreo
BACKUP_ORIGEN=/etc
BACKUP_DESTINO=/var/backups
KEEP_DAYS=7         # días de retención de backups
