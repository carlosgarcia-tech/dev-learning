events { worker_connections 1024; }
http {
    server {
        listen 8080;
        root /ruta/abs/a/web;
        index index.html;

        location ~* \.(css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location ~* \.(png|jpg|jpeg|svg)$ {
            expires 30d;
            add_header Cache-Control "public";
        }
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
        }
        location / { try_files $uri $uri/ =404; }
    }
}
