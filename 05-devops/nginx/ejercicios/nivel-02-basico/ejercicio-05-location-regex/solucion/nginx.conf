events { worker_connections 1024; }
http {
    server {
        listen 8080;
        root /ruta/abs/a/web;
        index index.html;

        location ~* \.php$ {
            return 403;
        }
        location ~* \.(jpg|png|gif|svg)$ {
            expires 30d;
        }
        location ~* \.(css|js)$ {
            expires 1y;
        }
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
