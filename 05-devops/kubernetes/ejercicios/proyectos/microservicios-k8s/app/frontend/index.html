<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiendaGalaxia — Kubernetes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f5f5f5;
      min-height: 100vh;
    }
    header {
      background: rgba(0, 0, 0, 0.3);
      padding: 1.5rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    header h1 {
      font-size: 1.8rem;
      background: linear-gradient(90deg, #38f9d7, #43e97b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p { font-size: 0.9rem; color: #a0a0c0; margin-top: 0.3rem; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1rem;
      backdrop-filter: blur(10px);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-3px); }
    .card h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .precio { color: #43e97b; font-weight: bold; font-size: 1.1rem; }
    .stock { color: #a0a0c0; font-size: 0.85rem; }
    .badge {
      display: inline-block;
      background: rgba(67, 233, 123, 0.15);
      color: #43e97b;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      margin-left: 0.5rem;
    }
    .estado {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #a0a0c0;
    }
    .punto {
      width: 10px; height: 10px; border-radius: 50%;
      background: #43e97b;
      box-shadow: 0 0 8px #43e97b;
    }
    .punto.error { background: #f5576c; box-shadow: 0 0 8px #f5576c; }
    button {
      background: linear-gradient(90deg, #43e97b, #38f9d7);
      border: none;
      color: #0f2027;
      font-weight: bold;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      margin: 0.5rem 0;
    }
    button:hover { opacity: 0.9; }
    #error { color: #f5576c; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>🚀 TiendaGalaxia</h1>
    <p>Proyecto final de Kubernetes — frontend + backend + base de datos</p>
  </header>

  <main>
    <div class="estado">
      <span id="punto" class="punto"></span>
      <span id="estado-texto">Conectando con la API…</span>
    </div>

    <button onclick="cargarProductos()">🔄 Recargar productos</button>
    <p id="error"></p>
    <div id="lista-productos"></div>
  </main>

  <script>
    // El Ingress enruta /api/* al backend. En el navegador usamos ruta relativa.
    const API_URL = '/api/productos';

    async function cargarProductos() {
      const lista = document.getElementById('lista-productos');
      const error = document.getElementById('error');
      const estadoTexto = document.getElementById('estado-texto');
      const punto = document.getElementById('punto');

      error.style.display = 'none';
      lista.innerHTML = '<p style="color:#a0a0c0">Cargando productos…</p>';

      try {
        const resp = await fetch(API_URL);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();

        estadoTexto.textContent = 'API conectada — ' + data.count + ' productos';
        punto.classList.remove('error');

        lista.innerHTML = data.productos.map(p => `
          <div class="card">
            <h2>${p.nombre} <span class="badge">#${p.id}</span></h2>
            <p class="precio">${Number(p.precio).toFixed(2)} €</p>
            <p class="stock">Stock: ${p.stock} unidades</p>
          </div>
        `).join('');
      } catch (e) {
        lista.innerHTML = '';
        error.style.display = 'block';
        error.textContent = 'No se pudo conectar con la API en ' + API_URL + ': ' + e.message;
        estadoTexto.textContent = 'API no disponible';
        punto.classList.add('error');
      }
    }

    // Cargar al iniciar.
    cargarProductos();
  </script>
</body>
</html>
