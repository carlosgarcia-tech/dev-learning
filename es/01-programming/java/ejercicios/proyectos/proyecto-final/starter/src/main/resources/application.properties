spring.application.name=biblioteca-api
server.port=8080

# Base de datos H2 en memoria (cambia a PostgreSQL en produccion)
spring.datasource.url=jdbc:h2:mem:bibliotecadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (ejemplo - usar variable de entorno en produccion)
app.jwt.secret=cambia-esta-clave-por-una-secreta-y-larga-en-produccion
app.jwt.expiration-ms=3600000

# Reglas de negocio de prestamos
app.prestamos.max-activos-por-usuario=3
app.prestamos.plazo-dias=14
app.prestamos.multa-por-dia=1.0
